name: Security Audit

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1' # Weekly audit

jobs:
  audit:
    name: Dependency & Static Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run npm Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Verify No Secrets Committed
        run: |
          if git grep -E "(PRIVATE KEY|API_KEY|SECRET_KEY)" -- ':!tests' ':!.github'; then
            echo "Potential secret found in codebase!"
            exit 1
          fi
